services:
  postgres:
    image: postgres:16
    container_name: carrovivo-db
    environment:
      POSTGRES_DB: ${DB_NAME:?DB_NAME não definido — copie env para .env}
      POSTGRES_USER: ${DB_USER:?DB_USER não definido — copie env para .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD não definido — copie env para .env}
    ports:
      - "5432:5432"
    volumes:
      - carrovivo_data:/var/lib/postgresql/data

volumes:
  carrovivo_data: